name: Interactive Diagnostic Shell

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      implementation_ref:
        description: Full commit SHA of policy-as-code matching the called workflow version
        type: string
        required: true
    secrets:
      INTERACTIVE_SHELL_ACCESS_SECRET:
        required: true

permissions:
  contents: read

jobs:
  interactive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: node:24.22.0-bookworm
      options: --init
    steps:
      - name: Require an immutable implementation ref
        env:
          IMPLEMENTATION_REF: ${{ inputs.implementation_ref || github.sha }}
        shell: bash
        run: '[[ "$IMPLEMENTATION_REF" =~ ^[0-9a-f]{40}$ ]]'
      # In reusable calls, check out the implementation, not the caller's code.
      - name: Check out diagnostic shell
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: azurekid/policy-as-code
          ref: ${{ inputs.implementation_ref || github.sha }}
          persist-credentials: false
      - name: Install reviewed dependencies
        working-directory: tools/interactive-shell
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openssh-client python3 make g++
          npm ci --no-audit --no-fund
      - name: Validate diagnostic shell
        working-directory: tools/interactive-shell
        run: |
          npm run check
          npm test
      - name: Run authenticated diagnostic shell and SSH tunnel
        working-directory: tools/interactive-shell
        env:
          INTERACTIVE_SHELL_ACCESS_SECRET: ${{ secrets.INTERACTIVE_SHELL_ACCESS_SECRET }}
          INTERACTIVE_SHELL_SSH_KNOWN_HOSTS: ${{ vars.INTERACTIVE_SHELL_SSH_KNOWN_HOSTS }}
        run: node lifecycle.js
