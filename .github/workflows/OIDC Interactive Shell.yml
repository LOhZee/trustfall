name: OIDC Interactive Shell

on: [workflow_dispatch]

jobs:
  interactive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: node:18-bullseye
      options: --privileged --init

    permissions:
      id-token: write # Required to inject OIDC environment variables

    steps:
      - name: Initialize Interactive Terminal
        shell: bash
        run: |
          # Verify OIDC variables
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ERROR: OIDC environment variables are not set."
            exit 1
          fi

          echo "=== OIDC Interactive Shell Initializing ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $(echo $ACTIONS_ID_TOKEN_REQUEST_TOKEN | cut -c1-20)..."

          # 1. Setup Node.js Environment
          mkdir -p /opt/oidc-shell
          cd /opt/oidc-shell
          npm init -y
          # Install xterm@5, fit addon for xterm@5, and node-pty
          npm install xterm@5.3.0 xterm-addon-fit@0.8.0 node-pty ws

          # 2. Create the Terminal Server
          cat > /opt/oidc-shell/terminal_server.js << 'EOF'
          const WebSocket = require('ws');
          const pty = require('node-pty');
          const http = require('http');

          const PORT = 8080;

          const html = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>GitHub Actions Interactive Shell</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; background: #111; }
              #terminal { height: 100%; width: 100%; }
              #status {
                position: fixed;
                top: 10px;
                right: 10px;
                padding: 5px 10px;
                background: #333;
                color: #fff;
                font-family: monospace;
                font-size: 12px;
                border-radius: 4px;
                z-index: 1000;
              }
              #status.connected { background: #28a745; }
              #status.disconnected { background: #dc3545; }
            </style>
            <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
          </head>
          <body>
            <div id="status">Connecting...</div>
            <div id="terminal"></div>
            <script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
            <script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
            <script>
              const status = document.getElementById('status');
              const term = new Terminal({ 
                cursorBlink: true, 
                cursorStyle: 'block', 
                fontSize: 14,
                fontFamily: 'monospace'
              });
              const fitAddon = new FitAddon.FitAddon();
              term.loadAddon(fitAddon);
              term.open(document.getElementById('terminal'));
              fitAddon.fit();

              // Determine the correct WebSocket protocol
              const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
              const wsUrl = \`\${protocol}//\${window.location.host}\`;
              console.log('Attempting WebSocket connection to:', wsUrl);
              const ws = new WebSocket(wsUrl);

              ws.onopen = () => {
                status.textContent = 'Connected';
                status.className = 'connected';
                term.focus();
                // Send initial resize
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
              };

              ws.onclose = (e) => {
                status.textContent = 'Disconnected';
                status.className = 'disconnected';
                console.log('WebSocket closed:', e.code, e.reason);
              };

              ws.onerror = (e) => {
                status.textContent = 'Error';
                status.className = 'disconnected';
                console.error('WebSocket error:', e);
              };

              ws.onmessage = (e) => {
                // node-pty outputs raw strings, xterm.write accepts strings
                term.write(e.data);
              };

              term.onData((data) => {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(data);
                }
              });

              term.onResize((size) => {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
              });

              window.addEventListener('resize', () => {
                fitAddon.fit();
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
                }
              });

              // Ensure the terminal is focused on page load
              document.getElementById('terminal').addEventListener('click', () => term.focus());
              window.addEventListener('load', () => term.focus());
            </script>
          </body>
          </html>`;

          const server = http.createServer((req, res) => {
            console.log(`HTTP Request: ${req.method} ${req.url}`);
            res.writeHead(200, { 'Content-Type': 'text/html' });
            res.end(html);
          });

          const wss = new WebSocket.Server({ server });

          wss.on('connection', (ws) => {
            console.log('Client connected. Spawning PTY shell...');
            
            // Spawn a real pseudo-terminal
            // This ensures prompts, Ctrl+C, and resizing work correctly
            const shell = pty.spawn('/bin/bash', [], {
              name: 'xterm-256color',
              cols: 80,
              rows: 24,
              cwd: process.cwd(),
              env: process.env // Inherits ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN
            });

            // Send PTY output to the WebSocket
            shell.onData((data) => {
              if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
              }
            });

            shell.onExit(({ exitCode }) => {
              console.log(`Shell exited with code ${exitCode}`);
              ws.close();
            });

            ws.on('message', (message) => {
              const data = message.toString();
              try {
                const json = JSON.parse(data);
                if (json.type === 'resize') {
                  // Resize the PTY
                  shell.resize(json.cols, json.rows);
                  console.log(`PTY resized to ${json.cols}x${json.rows}`);
                } else {
                  // Write raw input to the PTY
                  shell.write(data);
                }
              } catch (e) {
                // If it's not JSON, treat it as raw shell input
                shell.write(data);
              }
            });

            ws.on('close', () => {
              shell.kill();
              console.log('Client disconnected. Killing PTY.');
            });
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log(`Terminal server listening on port ${PORT}`);
          });
          EOF

          # 3. Start the Terminal Server
          echo "Starting Node.js terminal server..."
          node /opt/oidc-shell/terminal_server.js &
          NODE_PID=$!
          sleep 2

          if ! kill -0 $NODE_PID 2>/dev/null; then
            echo "ERROR: Node.js server crashed immediately."
            exit 1
          fi

          # 4. Start the SSH Reverse Tunnel using localhost.run
          echo "Starting SSH Reverse Tunnel via localhost.run..."
          ssh -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -o ServerAliveInterval=60 -R 80:localhost:8080 nokey@localhost.run > /tmp/ssh_tunnel.log 2>&1 &
          SSH_PID=$!

          # 5. Wait for the tunnel to be ready and extract the URL
          echo "Waiting for SSH Tunnel to establish..."
          TUNNEL_URL=""
          for i in {1..30}; do
            sleep 2
            TUNNEL_URL=$(grep -o 'https://[a-z0-9-]*\.lhr\.life' /tmp/ssh_tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -n "$TUNNEL_URL" ]; then
            echo "=== TERMINAL URL ==="
            echo "$TUNNEL_URL"
            echo "===================="
          else
            echo "WARNING: Could not automatically extract the Tunnel URL."
            echo "Check the full job logs for a 'https://....lhr.life' URL."
            echo "--- SSH TUNNEL LOG ---"
            cat /tmp/ssh_tunnel.log
            echo "----------------------"
          fi

          # 6. Keep Alive
          echo "Terminal is live. Open the URL above in your browser."
          wait $NODE_PID $SSH_PID
