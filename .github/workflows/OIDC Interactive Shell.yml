const WebSocket = require('ws');
const { spawn } = require('child_process');
const http = require('http');

const PORT = 8080;

const html = `
<!DOCTYPE html>
<html>
<head>
  <title>GitHub Actions Interactive Shell</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; }
    #terminal { height: 100%; width: 100%; }
    #status {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background: #333;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      z-index: 1000;
    }
    #status.connected { background: #28a745; }
    #status.disconnected { background: #dc3545; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
</head>
<body>
  <div id="status">Connecting...</div>
  <div id="terminal"></div>
  <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
  <script src="https://unpkg.com/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
  <script>
    const status = document.getElementById('status');
    const term = new Terminal({ cursorBlink: true, cursorStyle: 'block', fontSize: 14 });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Determine the correct WebSocket protocol
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = \`\${protocol}//\${window.location.host}\`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      status.textContent = 'Connected';
      status.className = 'connected';
      term.focus();
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onclose = () => {
      status.textContent = 'Disconnected';
      status.className = 'disconnected';
    };

    ws.onerror = (e) => {
      status.textContent = 'Error';
      status.className = 'disconnected';
      console.error('WebSocket error:', e);
    };

    ws.onmessage = (e) => {
      term.write(e.data);
    };

    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    });

    term.onResize((size) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    });

    // Ensure the terminal is focused on page load
    document.getElementById('terminal').addEventListener('click', () => term.focus());
    window.addEventListener('load', () => term.focus());
  </script>
</body>
</html>`;

const server = http.createServer((req, res) => {
  res.writeHead(200, { 'Content-Type': 'text/html' });
  res.end(html);
});

const wss = new WebSocket.Server({ server });

wss.on('connection', (ws) => {
  console.log('Client connected. Spawning shell...');
  
  // Spawn the shell with the GitHub Actions environment
  const shell = spawn('/bin/bash', [], {
    env: process.env,
    stdio: 'pipe'
  });

  shell.stdout.on('data', (data) => {
    ws.send(data.toString());
  });

  shell.stderr.on('data', (data) => {
    ws.send(data.toString());
  });

  shell.on('close', (code) => {
    console.log('Shell exited with code ' + code);
    ws.close();
  });

  ws.on('message', (message) => {
    const data = message.toString();
    try {
      const json = JSON.parse(data);
      if (json.type === 'resize') {
        console.log(`Resize requested: ${json.cols}x${json.rows}`);
      } else {
        shell.stdin.write(data);
      }
    } catch (e) {
      // If it's not JSON, treat it as raw shell input
      shell.stdin.write(data);
    }
  });

  ws.on('close', () => {
    shell.kill();
    console.log('Client disconnected. Killing shell.');
  });
});

server.listen(PORT, '0.0.0.0', () => {
  console.log(`Terminal server listening on port ${PORT}`);
});
