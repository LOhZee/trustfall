name: OIDC Interactive Shell

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID: { required: false }
      AZURE_SUBSCRIPTION_ID: { required: false }
      AZURE_TENANT_ID: { required: false }
      PAT_GITHUB_TOKEN: { required: false }

jobs:
  interactive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    container:
      image: node:18-bullseye
      options: --privileged --init

    permissions:
      contents: read
      id-token: write

    env:
      APP_DIR: /opt/oidc-shell
      PORT: "8080"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout repository assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${APP_DIR}"/public
          cd "${APP_DIR}"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @xterm/xterm @xterm/addon-fit node-pty ws

      - name: Deploy assets to runtime directory
        shell: bash
        run: |
          set -euo pipefail
          
          # Ensure public directory exists
          mkdir -p "${APP_DIR}/public"
          
          # Copy assets safely, handling potential missing optional files
          if [ -d "${GITHUB_WORKSPACE}/assets" ]; then
            cp -R "${GITHUB_WORKSPACE}/assets/"* "${APP_DIR}/public/"
          else
            echo "ERROR: assets directory not found in workspace."
            exit 1
          fi

          # Move the backend server script out of public root if placed there
          if [ -f "${APP_DIR}/public/terminal_server.js" ]; then
            mv "${APP_DIR}/public/terminal_server.js" "${APP_DIR}/terminal_server.js"
          fi

      - name: Launch terminal server
        shell: bash
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          node "${APP_DIR}/terminal_server.js" > /tmp/node_server.log 2>&1 &
          echo $! > /tmp/node.pid
          sleep 2

      - name: Start tunnel
        shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -o ServerAliveInterval=60 \
            -R 80:localhost:${PORT} nokey@localhost.run > /tmp/ssh_tunnel.log 2>&1 &
          echo $! > /tmp/ssh.pid

      - name: Print tunnel URL
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            sleep 2
            TUNNEL_URL="$(grep -oE 'https://[a-z0-9-]+\.lhr\.life' /tmp/ssh_tunnel.log | head -n 1 || true)"
            if [ -n "${TUNNEL_URL}" ]; then
              echo "=== TERMINAL URL ==="
              echo "${TUNNEL_URL}"
              echo "===================="
              break
            fi
          done

      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail
          NODE_PID="$(cat /tmp/node.pid)"
          SSH_PID="$(cat /tmp/ssh.pid)"
          trap 'kill ${SSH_PID} ${NODE_PID} 2>/dev/null || true' EXIT
          while [ ! -f /tmp/terminal_exit_code ]; do
            if ! kill -0 "${NODE_PID}" 2>/dev/null || ! kill -0 "${SSH_PID}" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          fi
          exit "$(cat /tmp/terminal_exit_code)"
