name: OIDC Interactive Shell

on:
  workflow_dispatch:
  workflow_call:

jobs:
  interactive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    container:
      image: node:18-bullseye
      options: --privileged --init

    permissions:
      contents: read
      id-token: write # Required to inject OIDC environment variables

    env:
      APP_DIR: /opt/oidc-shell
      PORT: "8080"

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify OIDC environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ERROR: OIDC environment variables are not set."
            exit 1
          fi

          echo "=== OIDC Interactive Shell Initializing ==="
          echo "OIDC request environment is available."

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${APP_DIR}"/public
          cd "${APP_DIR}"

          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @xterm/xterm @xterm/addon-fit node-pty ws

      - name: Write terminal web UI
        shell: bash
        run: |
          set -euo pipefail
          cat > "${APP_DIR}/public/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>AzureHacking | Interactive Runner Console</title>
            <meta name="color-scheme" content="dark" />
            <link rel="icon" href="https://azurehacking.com/images/favicon.svg" type="image/svg+xml" />
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" />
            <style>
              :root {
                --bg: #0a0a0f;
                --surface: #12121a;
                --accent: #00d4ff;
                --purple: #7c3aed;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --border: #2d2d44;
              }
              *, *::before, *::after { box-sizing: border-box; }
              html, body { margin: 0; height: 100%; background: var(--bg); }
              body {
                display: flex;
                flex-direction: column;
                height: 100dvh;
                color: var(--text);
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background:
                  radial-gradient(ellipse at top right, #7c3aed26, transparent 55%),
                  radial-gradient(ellipse at bottom left, #00d4ff12, transparent 50%),
                  linear-gradient(135deg, #0a0a0ff2, #0a0a0fe6),
                  url('https://blackcatwebshop.z13.web.core.windows.net/media/azure-hacking-corp.jpg') center / cover;
              }
              .site-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                padding: 16px 28px;
                border-bottom: 1px solid var(--border);
                background: #12121ae8;
                flex-shrink: 0;
              }
              .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
              #logo { width: 24px; height: 24px; color: #00ff00; flex-shrink: 0; }
              .brand-name {
                font: 400 1.15rem/1.2 'Share Tech Mono', monospace;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                white-space: nowrap;
              }
              .brand-azure { color: #00ff00; }
              .brand-hacking { color: var(--accent); }
              .eyebrow {
                margin: 6px 0 0;
                font: 11px/1.5 'Share Tech Mono', monospace;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: var(--muted);
              }
              #status {
                display: inline-flex;
                align-items: center;
                gap: 9px;
                padding: 10px 14px;
                border: 1px solid #74602b;
                background: #30270f;
                color: #ffdc80;
                font: 12px/1.4 monospace;
                border-radius: 999px;
                white-space: nowrap;
              }
              #status::before {
                content: '';
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: currentColor;
                box-shadow: 0 0 10px currentColor;
              }
              #status.connected { color: #6ee7b7; background: #102820; border-color: #24634e; }
              #status.disconnected { color: #fca5a5; background: #2d161e; border-color: #7d354c; }
              main {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                padding: 24px 28px 16px;
                gap: 18px;
              }
              .intro { flex-shrink: 0; }
              .intro .eyebrow { color: var(--accent); margin: 0 0 8px; }
              h1 {
                font-size: clamp(22px, 3vw, 34px);
                letter-spacing: -1px;
                margin: 0;
                color: var(--accent);
                background: linear-gradient(135deg, var(--accent), #a78bfa);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              .description { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
              .console {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: #0a0a0f;
                box-shadow: 0 20px 60px #0008, 0 0 30px #00d4ff10;
              }
              .console-bar {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 12px 16px;
                background: linear-gradient(110deg, var(--surface), #1a1a2e);
                border-bottom: 1px solid var(--border);
                font: 12px/1.4 monospace;
                color: var(--muted);
                flex-shrink: 0;
              }
              .window-dots { display: flex; gap: 6px; }
              .window-dots i { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
              .window-dots i:nth-child(2) { background: var(--purple); }
              .window-dots i:last-child { background: var(--accent); }
              .console-label { margin-left: auto; color: var(--accent); }
              #terminal { flex: 1; min-height: 0; min-width: 0; width: 100%; padding: 14px; }
              .session-footer {
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px 20px;
                padding: 0 28px 16px;
                color: var(--muted);
                font: 11px/1.6 monospace;
                flex-shrink: 0;
              }
              kbd { color: var(--text); font: inherit; }
              @media (max-width: 600px) {
                .site-header { padding: 12px 14px; gap: 10px; }
                #logo { width: 21px; height: 21px; }
                .brand { gap: 8px; }
                .brand-name { font-size: 16px; }
                .brand .eyebrow { font-size: 9px; letter-spacing: 1px; }
                #status { padding: 8px 10px; font-size: 11px; }
                main { padding: 18px 12px 12px; gap: 14px; }
                #terminal { padding: 10px; }
                .console-bar { padding: 10px 12px; }
                .console-label { display: none; }
                .session-footer { padding: 0 14px 12px; }
              }
              @media (max-height: 500px) {
                .intro { display: none; }
                main { padding-top: 12px; }
              }
            </style>
            <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm/css/xterm.css" />
          </head>
          <body>
            <header class="site-header">
              <div class="brand">
                <svg id="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
                  <path d="m4 5 7 7-7 7M13 19h7" />
                </svg>
                <div>
                  <div class="brand-name"><span class="brand-azure">Azure</span><span class="brand-hacking">Hacking</span></div>
                  <p class="eyebrow">Security research console</p>
                </div>
              </div>
              <div id="status" role="status" aria-live="polite">Connecting...</div>
            </header>
            <main>
              <section class="intro" aria-labelledby="console-title">
                <p class="eyebrow">GitHub Actions / Interactive session</p>
                <h1 id="console-title">Runner console<span style="color: var(--accent)">_</span></h1>
                <p class="description">An ephemeral workspace for authorised security research. Commands execute inside the runner job container.</p>
              </section>
              <section class="console" aria-label="Interactive terminal">
                <div class="console-bar">
                  <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                  <span>bash / runner</span>
                  <span class="console-label">AZUREHACKING // CONSOLE</span>
                </div>
                <div id="terminal"></div>
              </section>
            </main>
            <footer class="session-footer">
              <span><kbd>Ctrl+C</kbd> interrupt &nbsp; / &nbsp; <kbd>exit</kbd> end job</span>
              <span>Authorised use only / Session ends with the job</span>
            </footer>

            <script src="https://unpkg.com/@xterm/xterm/lib/xterm.js"></script>
            <script src="https://unpkg.com/@xterm/addon-fit/lib/addon-fit.js"></script>
            <script>
              const status = document.getElementById('status');
              const term = new Terminal({
                cursorBlink: true,
                cursorStyle: 'block',
                fontSize: 14,
                fontFamily: 'Menlo, Consolas, monospace',
                theme: {
                  background: '#0a0a0f',
                  foreground: '#e2e8f0',
                  cursor: '#00d4ff',
                  cursorAccent: '#0a0a0f',
                  selectionBackground: '#35305b',
                  black: '#12121a',
                  red: '#ff8585',
                  green: '#6ee7b7',
                  yellow: '#ffdc80',
                  blue: '#80bfff',
                  magenta: '#d4a5ff',
                  cyan: '#00d4ff',
                  white: '#e2e8f0',
                  brightBlack: '#94a3b8',
                  brightRed: '#ffaaaa',
                  brightGreen: '#a3ffa3',
                  brightYellow: '#ffe9ad',
                  brightBlue: '#b0d6ff',
                  brightMagenta: '#e5c5ff',
                  brightCyan: '#b0fff4',
                  brightWhite: '#ffffff'
                }
              });

              const fitAddon = new FitAddon.FitAddon();
              term.loadAddon(fitAddon);
              term.open(document.getElementById('terminal'));
              fitAddon.fit();

              const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
              const ws = new WebSocket(`${protocol}//${window.location.host}`);

              ws.onopen = () => {
                status.textContent = 'Connected';
                status.className = 'connected';
                term.focus();
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
              };

              ws.onclose = (e) => {
                status.textContent = 'Disconnected';
                status.className = 'disconnected';
                console.log('WebSocket closed:', e.code, e.reason);
              };

              ws.onerror = (e) => {
                status.textContent = 'Error';
                status.className = 'disconnected';
                console.error('WebSocket error:', e);
              };

              ws.onmessage = (e) => term.write(e.data);

              term.onData((data) => {
                if (ws.readyState === WebSocket.OPEN) ws.send(data);
              });

              term.onResize((size) => {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
              });

              const terminalResizeObserver = new ResizeObserver(() => fitAddon.fit());
              terminalResizeObserver.observe(document.getElementById('terminal'));

              document.getElementById('terminal').addEventListener('click', () => term.focus());
              window.addEventListener('load', () => term.focus());
              setTimeout(() => fitAddon.fit(), 150);
            </script>
          </body>
          </html>
          EOF

      - name: Write terminal server
        shell: bash
        run: |
          set -euo pipefail
          cat > "${APP_DIR}/terminal_server.js" << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const http = require('http');
          const WebSocket = require('ws');
          const pty = require('node-pty');

          const PORT = Number(process.env.PORT || 8080);
          const HTML_PATH = path.join(__dirname, 'public', 'index.html');
          const html = fs.readFileSync(HTML_PATH, 'utf8');
          const shells = new Set();
          let ending = false;

          const server = http.createServer((req, res) => {
            res.writeHead(200, { 'Content-Type': 'text/html' });
            res.end(html);
          });

          const wss = new WebSocket.Server({ server });

          function welcomeBanner() {
            const access = process.getuid() === 0
              ? 'Root access to the GitHub Actions runner job container'
              : 'Non-root access to the GitHub Actions runner job container';

            const border = '+' + '-'.repeat(60) + '+';
            const lines = [
              '',
              'We have',
              access,
              'Ctrl+C interrupts a command; exit ends the job.'
            ];

            return (
              '\x1b[0m\x1b[36m' + border + '\r\n' +
              lines.map((line) => `| \x1b[0m${line.padEnd(58)}\x1b[36m |`).join('\r\n') +
              '\r\n' + border + '\x1b[0m\r\n'
            );
          }

          wss.on('connection', (ws) => {
            ws.send(welcomeBanner());

            const shell = pty.spawn('/bin/bash', [], {
              name: 'xterm-256color',
              cols: 80,
              rows: 24,
              cwd: process.env.GITHUB_WORKSPACE,
              env: process.env
            });
            shells.add(shell);
            let disconnected = false;

            shell.onData((data) => {
              if (ws.readyState === WebSocket.OPEN) ws.send(data);
            });

            shell.onExit(({ exitCode }) => {
              shells.delete(shell);
              console.log(`Shell exited with code ${exitCode}`);
              if (disconnected || ending) return;
              ending = true;
              fs.writeFileSync('/tmp/terminal_exit_code', String(exitCode));
              for (const otherShell of shells) otherShell.kill();
              process.exit(exitCode);
            });

            ws.on('message', (message) => {
              const data = message.toString();
              try {
                const json = JSON.parse(data);
                if (json.type === 'resize') {
                  shell.resize(json.cols, json.rows);
                } else {
                  shell.write(data);
                }
              } catch {
                shell.write(data);
              }
            });

            ws.on('close', () => {
              disconnected = true;
              shell.kill();
            });
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log(`Terminal server listening on port ${PORT}`);
          });
          EOF

      - name: Launch terminal server
        shell: bash
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          rm -f /tmp/terminal_exit_code

          node "${APP_DIR}/terminal_server.js" > /tmp/node_server.log 2>&1 &
          NODE_PID=$!
          echo "${NODE_PID}" > /tmp/node.pid
          sleep 2

          if ! kill -0 "${NODE_PID}" 2>/dev/null; then
            echo "ERROR: Node.js server crashed immediately."
            cat /tmp/node_server.log || true
            exit 1
          fi

      - name: Start localhost.run tunnel
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=60 \
            -R 80:localhost:${PORT} \
            nokey@localhost.run > /tmp/ssh_tunnel.log 2>&1 &
          SSH_PID=$!
          echo "${SSH_PID}" > /tmp/ssh.pid

      - name: Print tunnel URL
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for SSH tunnel to establish..."
          TUNNEL_URL=""
          for _ in {1..30}; do
            sleep 2
            TUNNEL_URL="$(grep -oE 'https://[a-z0-9-]+\.lhr\.life' /tmp/ssh_tunnel.log | head -n 1 || true)"
            if [ -n "${TUNNEL_URL}" ]; then
              break
            fi
          done

          if [ -n "${TUNNEL_URL}" ]; then
            echo "=== TERMINAL URL ==="
            echo "${TUNNEL_URL}"
            echo "===================="
          else
            echo "WARNING: Could not automatically extract the tunnel URL."
            echo "--- SSH TUNNEL LOG ---"
            cat /tmp/ssh_tunnel.log || true
            echo "----------------------"
          fi

      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail
          NODE_PID="$(cat /tmp/node.pid)"
          SSH_PID="$(cat /tmp/ssh.pid)"
          cleanup() {
            for pid in "${SSH_PID}" "${NODE_PID}"; do
              if kill -0 "${pid}" 2>/dev/null; then
                kill "${pid}"
              fi
            done
          }
          trap cleanup EXIT
          echo "Terminal is live. Open the URL above in your browser."
          while [ ! -f /tmp/terminal_exit_code ]; do
            if ! kill -0 "${NODE_PID}" 2>/dev/null; then
              if [ -f /tmp/terminal_exit_code ]; then
                break
              fi
              echo "ERROR: Terminal server stopped unexpectedly."
              cat /tmp/node_server.log
              exit 1
            fi
            if ! kill -0 "${SSH_PID}" 2>/dev/null; then
              echo "ERROR: SSH tunnel stopped unexpectedly."
              cat /tmp/ssh_tunnel.log
              exit 1
            fi
            sleep 1
          done
          EXIT_CODE="$(cat /tmp/terminal_exit_code)"
          echo "Terminal session ended with exit code ${EXIT_CODE}."
          exit "${EXIT_CODE}"
