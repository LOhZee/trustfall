name: OIDC Interactive Shell

on: [workflow_dispatch]

jobs:
  interactive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: node:18-bullseye
      options: --privileged --init

    permissions:
      id-token: write # Required to inject OIDC environment variables

    steps:
      - name: Initialize Interactive Terminal
        shell: bash
        run: |
          # Verify OIDC variables
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ERROR: OIDC environment variables are not set."
            exit 1
          fi

          echo "=== OIDC Interactive Shell Initializing ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $(echo $ACTIONS_ID_TOKEN_REQUEST_TOKEN | cut -c1-20)..."

          # 1. Setup Node.js Environment
          mkdir -p /opt/oidc-shell
          cd /opt/oidc-shell
          npm init -y
          npm install ws

          # 2. Create the Terminal Server
          cat > /opt/oidc-shell/terminal_server.js << 'EOF'
          const WebSocket = require('ws');
          const { spawn } = require('child_process');
          const http = require('http');

          const PORT = 8080;

          const html = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>GitHub Actions Interactive Shell</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; background: #111; }
              #terminal { height: 100%; width: 100%; }
            </style>
            <link rel="stylesheet" href="https://unpkg.com/xterm@4.19.0/css/xterm.css" />
          </head>
          <body>
            <div id="terminal"></div>
            <script src="https://unpkg.com/xterm@4.19.0/lib/xterm.js"></script>
            <script src="https://unpkg.com/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
            <script>
              const term = new Terminal({ cursorBlink: true, cursorStyle: 'block' });
              const fitAddon = new FitAddon.FitAddon();
              term.loadAddon(fitAddon);
              term.open(document.getElementById('terminal'));
              fitAddon.fit();

              const ws = new WebSocket('ws://' + location.host);

              ws.onopen = () => {
                term.focus();
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
              });

              ws.onmessage = (e) => {
                term.write(e.data);
              });

              term.onData((data) => {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(data);
                }
              });

              term.onResize((size) => {
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ type: 'resize', cols: size.cols, rows: size.rows }));
                }
              });

              window.addEventListener('resize', () => fitAddon.fit());
            </script>
          </body>
          </html>`;

          const server = http.createServer((req, res) => {
            res.writeHead(200, { 'Content-Type': 'text/html' });
            res.end(html);
          });

          const wss = new WebSocket.Server({ server });

          wss.on('connection', (ws) => {
            console.log('Client connected. Spawning shell...');
            const shell = spawn('/bin/bash', [], {
              env: process.env,
              stdio: 'pipe'
            });

            shell.stdout.on('data', (data) => ws.send(data.toString()));
            shell.stderr.on('data', (data) => ws.send(data.toString()));
            shell.on('close', (code) => {
              console.log('Shell exited with code ' + code);
              ws.close();
            });

            ws.on('message', (message) => {
              const data = message.toString();
              try {
                const json = JSON.parse(data);
                if (json.type === 'resize') {
                  console.log(`Resize requested: ${json.cols}x${json.rows}`);
                } else {
                  shell.stdin.write(data);
                }
              } catch (e) {
                shell.stdin.write(data);
              }
            });

            ws.on('close', () => {
              shell.kill();
              console.log('Client disconnected. Killing shell.');
            });
          });

          server.listen(PORT, '0.0.0.0', () => {
            console.log(`Terminal server listening on port ${PORT}`);
          });
          EOF

          # 3. Install cloudflared
          echo "Downloading cloudflared..."
          curl -L -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          /usr/local/bin/cloudflared --version

          # 4. Start the Terminal Server
          echo "Starting Node.js terminal server..."
          node /opt/oidc-shell/terminal_server.js &
          NODE_PID=$!
          sleep 2

          if ! kill -0 $NODE_PID 2>/dev/null; then
            echo "ERROR: Node.js server crashed immediately."
            exit 1
          fi

          # 5. Start the Cloudflare Quick Tunnel
          echo "Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!

          # 6. Wait for the tunnel to be ready and extract the URL
          echo "Waiting for Cloudflare Quick Tunnel to establish..."
          CLOUDFLARE_URL=""
          for i in {1..30}; do
            sleep 2
            CLOUDFLARE_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$CLOUDFLARE_URL" ]; then
              break
            fi
          done

          if [ -n "$CLOUDFLARE_URL" ]; then
            echo "=== TERMINAL URL ==="
            echo "$CLOUDFLARE_URL"
            echo "===================="
          else
            echo "WARNING: Could not automatically extract the Cloudflare URL."
            echo "Check the full job logs for a 'https://....trycloudflare.com' URL."
            echo "--- CLOUDFLARED LOG ---"
            cat /tmp/cloudflared.log
            echo "-----------------------"
          fi

          # 7. Keep Alive
          echo "Terminal is live. Open the URL above in your browser."
          wait $NODE_PID $CLOUDFLARED_PID
