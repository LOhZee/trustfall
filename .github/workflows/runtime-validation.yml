name: Runtime validation (publishes non-release image)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustfall-runtime-validation
  cancel-in-progress: false

jobs:
  authorize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restrict package-writing validation to main
        shell: bash
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$REF" == refs/heads/main ]] || {
            echo "runtime validation may publish only from refs/heads/main" >&2
            exit 1
          }

  build-image:
    needs: authorize-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/lohzee/trustfall:validation-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/LOhZee/trustfall
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=validation
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: mode=max

  passive-default:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init
    env:
      TRUSTFALL_CONTAINER_IMAGE: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Verify job-container runtime and audit behavior
        shell: sh
        run: |
          set -eu
          command -v trustfall >/dev/null
          test -x /bin/sh
          test -d "$RUNNER_TEMP" && test -w "$RUNNER_TEMP"
          : >> "$GITHUB_OUTPUT"
          printf '## Default container validation\n' >> "$GITHUB_STEP_SUMMARY"
          trustfall doctor
          trustfall assess --profile baseline --no-network --output "$RUNNER_TEMP/default.json" --sarif "$RUNNER_TEMP/default.sarif" --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate deterministic enforcement and malformed-policy exits
        shell: sh
        run: |
          set -eu
          umask 077
          printf '%s\n' 'version: "1"' 'mode: enforce' 'fail_on: critical' 'expectations:' '  TF-ID-001:' '    status: fail' '    condition: process must run as root for this deliberately failing validation' > "$RUNNER_TEMP/enforce.yaml"
          set +e
          trustfall assess --profile custom --policy "$RUNNER_TEMP/enforce.yaml" --no-network --output "$RUNNER_TEMP/default-enforce.json"
          enforce_status=$?
          printf '%s\n' 'version: "1"' 'mode: audit' 'unknown_field: true' > "$RUNNER_TEMP/malformed.yaml"
          trustfall assess --profile custom --policy "$RUNNER_TEMP/malformed.yaml" --no-network --output "$RUNNER_TEMP/malformed.json"
          malformed_status=$?
          set -e
          test "$enforce_status" -eq 2
          test "$malformed_status" -eq 1

          malformed_report=false
          if [ -e "$RUNNER_TEMP/malformed.json" ]; then malformed_report=true; fi
          printf '{"audit_exit":0,"enforce_exit":%s,"malformed_policy_exit":%s,"malformed_report_exists":%s}\n' \
            "$enforce_status" "$malformed_status" "$malformed_report" > "$RUNNER_TEMP/default-validation-exits.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-default
          # One glob gives upload-artifact a single stable least-common path;
          # multiple absolute paths are otherwise archived with /__w/_temp.
          path: ${{ runner.temp }}/default*
          if-no-files-found: error

  passive-hardened:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    env:
      TRUSTFALL_CONTAINER_IMAGE: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Assess hardened runtime without changing assessment policy
        shell: sh
        run: trustfall assess --profile baseline --no-network --output "$RUNNER_TEMP/hardened.json" --sarif "$RUNNER_TEMP/hardened.sarif" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-hardened
          path: ${{ runner.temp }}/hardened.*
          if-no-files-found: error

  oidc-unavailable:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    env:
      TRUSTFALL_CONTAINER_IMAGE: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Confirm missing OIDC permission remains inconclusive
        shell: sh
        run: |
          set -eu
          trustfall assess --profile baseline --request-oidc --output "$RUNNER_TEMP/no-oidc.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-no-oidc
          path: ${{ runner.temp }}/no-oidc.json
          if-no-files-found: error

  oidc-enabled:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    env:
      TRUSTFALL_CONTAINER_IMAGE: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Verify GitHub OIDC issuance and selected claims
        shell: sh
        run: |
          set -eu
          trustfall assess --profile baseline --request-oidc --oidc-audience trustfall --output "$RUNNER_TEMP/oidc.json" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-oidc
          path: ${{ runner.temp }}/oidc.json
          if-no-files-found: error

  network-boundaries:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    env:
      TRUSTFALL_CONTAINER_IMAGE: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
    steps:
      - name: Verify explicitly allowlisted public network operations
        shell: sh
        run: |
          set -eu
          umask 077
          printf '%s\n' \
            'version: "1"' \
            'mode: audit' \
            'network:' \
            '  concurrency: 3' \
            '  targets:' \
            '    - name: github-dns' \
            '      type: dns' \
            '      address: github.com' \
            '      expect_reachable: true' \
            '    - name: github-tcp' \
            '      type: tcp' \
            '      address: github.com:443' \
            '      expect_reachable: true' \
            '    - name: github-https' \
            '      type: https' \
            '      address: https://github.com/' \
            '      expect_reachable: true' \
            '  metadata:' \
            '    enabled: true' \
            '    providers: [aws, azure, gcp]' > "$RUNNER_TEMP/network.yaml"
          trustfall assess --profile custom --policy "$RUNNER_TEMP/network.yaml" --timeout 15s \
            --output "$RUNNER_TEMP/network.json" --sarif "$RUNNER_TEMP/network.sarif" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-network
          path: ${{ runner.temp }}/network.*
          if-no-files-found: error

  compare:
    needs: [build-image, passive-default, passive-hardened]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: ghcr.io/lohzee/trustfall@${{ needs.build-image.outputs.digest }}
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-default
          path: reports/default
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-hardened
          path: reports/hardened
      - name: Compare actual runtime configurations
        shell: sh
        run: trustfall compare --output comparison.json reports/default/default.json reports/hardened/hardened.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-comparison
          path: comparison.json
          if-no-files-found: error

  validate-artifacts:
    needs: [passive-default, passive-hardened, oidc-unavailable, oidc-enabled, network-boundaries, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-default
          path: reports/default
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-hardened
          path: reports/hardened
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-no-oidc
          path: reports/no-oidc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-oidc
          path: reports/oidc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-network
          path: reports/network
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-comparison
          path: reports/comparison
      - name: Assert report meaning with structured JSON queries
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .run.network_denied == true and
            ([.findings[] | select(.rule_id == "TF-ID-004" and .evidence_classification == "unknown" and .status == "not_applicable" and .evidence.token_requested == false)] | length == 1) and
            ([.findings[] | select(.rule_id == "TF-ISO-001" and .evidence_classification == "observed")] | length == 1)
          ' reports/default/default.json >/dev/null

          jq -e '.audit_exit == 0 and .enforce_exit == 2 and .malformed_policy_exit == 1 and .malformed_report_exists == false' \
            reports/default/default-validation-exits.json >/dev/null
          jq -e '.run.policy_mode == "enforce" and ([.findings[] | select(.rule_id == "TF-ID-001" and .evidence_classification == "observed" and .status == "pass" and .expected_condition == "process must run as root for this deliberately failing validation" and .evidence.uid != 0)] | length == 1)' \
            reports/default/default-enforce.json >/dev/null

          jq -e '
            [.findings[] | select(
              .rule_id == "TF-ID-004" and
              .evidence_classification == "unknown" and
              .status == "unknown" and
              .evidence.token_requested == true and
              .evidence.token_issued == false and
              .evidence.raw_token_recorded == false
            )] | length == 1
          ' reports/no-oidc/no-oidc.json >/dev/null

          jq -e '
            [.findings[] | select(
              .rule_id == "TF-ID-004" and
              .evidence_classification == "verified" and
              .status == "pass" and
              .evidence.issuer_valid == true and
              .evidence.audience_valid == true and
              .evidence.subject_present == true and
              .evidence.temporal_claims_valid == true and
              .evidence.signature_verified == false and
              .evidence.raw_token_recorded == false and
              .evidence.memory_erasure_guaranteed == false
            )] | length == 1
          ' reports/oidc/oidc.json >/dev/null

          jq -e '
            ([.findings[] | select(.rule_id == "TF-NET-001" and .evidence_classification == "verified" and .status == "pass" and .evidence.operation_succeeded == true)] | length == 3) and
            ([.findings[] | select(.rule_id == "TF-NET-001" and .evidence.target == "github-dns" and .evidence.outcome == "dns_resolved")] | length == 1) and
            ([.findings[] | select(.rule_id == "TF-NET-001" and .evidence.target == "github-tcp" and .evidence.outcome == "tcp_connected")] | length == 1) and
            ([.findings[] | select(.rule_id == "TF-NET-001" and .evidence.target == "github-https" and .evidence.outcome == "http_response" and (.evidence.http_status | type == "number"))] | length == 1) and
            ([.findings[] | select(.rule_id == "TF-NET-002")] | length == 3) and
            ([.findings[] | select(.rule_id == "TF-NET-002" and (.status == "informational" or .status == "unknown") and .status != "fail" and .evidence.metadata_retrieved == false and .evidence.credential_path_requested == false and .evidence.credential_exposure_tested == false and .evidence.response_body_read == false)] | length == 3)
          ' reports/network/network.json >/dev/null

          jq -e '
            .context.runtime_comparable == false and
            ([.changes[] | select(.rule_id == "TF-ISO-001" and .category == "changed" and (.before.evidence.capbnd | length > 0) and (.after.evidence.capbnd | length == 0))] | length == 1) and
            ([.changes[] | select(.rule_id == "TF-ISO-002" and .category == "improvement" and .before.evidence.no_new_privileges == false and .after.evidence.no_new_privileges == true)] | length == 1)
          ' reports/comparison/comparison.json >/dev/null

      - name: Reject credential-shaped artifact content
        shell: bash
        run: |
          set -euo pipefail
          if grep -EIR 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.|Bearer[[:space:]]+[A-Za-z0-9._~-]{8,}|AKIA[0-9A-Z]{16}' reports; then
            echo "credential-shaped content found in runtime artifacts" >&2
            exit 1
          fi
