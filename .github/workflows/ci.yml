name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Build CLI
        run: go build -trimpath -o trustfall ./cmd/trustfall
      - name: Smoke test audit behavior
        run: |
          ./trustfall assess --profile baseline --no-network --output report.json --sarif report.sarif
          ./trustfall compare --output comparison.json report.json report.json
      - name: Validate generated JSON and SARIF schemas
        env:
          SARIF_SCHEMA_URL: https://raw.githubusercontent.com/oasis-tcs/sarif-spec/a560296ca8c921f3bdb8d4a8db57ab83dae968a7/sarif-2.1/schema/sarif-schema-2.1.0.json
          SARIF_SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$SARIF_SCHEMA_URL" --output "$RUNNER_TEMP/sarif-schema.json"
          printf '%s  %s\n' "$SARIF_SCHEMA_SHA256" "$RUNNER_TEMP/sarif-schema.json" | sha256sum --check --status
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 schemas/report-v1.schema.json report.json
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 schemas/comparison-v1.schema.json comparison.json
          go run github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0 "$RUNNER_TEMP/sarif-schema.json" report.sarif
          jq -e '.schema_version == "1.0.0" and (.findings | length > 0)' report.json

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build local image
        run: docker build --build-arg VERSION=ci --tag trustfall:ci .
      - name: Local container smoke test
        run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges trustfall:ci assess --profile baseline --no-network
      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: trustfall:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
