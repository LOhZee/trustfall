name: Interactive Diagnostic Shell Caller

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-remote:
    uses: ./.github/workflows/OIDC Interactive Shell.yml
    with:
      implementation_ref: ${{ github.sha }}
    secrets:
      INTERACTIVE_SHELL_ACCESS_SECRET: ${{ secrets.INTERACTIVE_SHELL_ACCESS_SECRET }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
