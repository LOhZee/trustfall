name: Deploy Policy

on:
  push:
    branches: [main]
    paths:
      - infra/policy-definition.bicep
      - infra/policy-assignment.bicep
      - .github/workflows/deploy-policy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-policy
  cancel-in-progress: false

jobs:
  definition:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      policy-definition-id: ${{ steps.definition.outputs.policy-definition-id }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      MANAGEMENT_GROUP_ID: ${{ vars.MANAGEMENT_GROUP_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build policy definition
        run: az bicep build --file infra/policy-definition.bicep --outfile "$RUNNER_TEMP/policy-definition.json"
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy policy definition
        id: definition
        shell: bash
        run: |
          set -euo pipefail
          : "${MANAGEMENT_GROUP_ID:?Set MANAGEMENT_GROUP_ID}"
          definition_id=$(az deployment mg create \
            --name policy-definition \
            --management-group-id "$MANAGEMENT_GROUP_ID" \
            --location "$AZURE_LOCATION" \
            --template-file "$RUNNER_TEMP/policy-definition.json" \
            --query properties.outputs.policyDefinitionId.value --output tsv)
          echo "policy-definition-id=$definition_id" >> "$GITHUB_OUTPUT"

  assignment:
    needs: definition
    runs-on: ubuntu-latest
    environment: production-bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      MANAGEMENT_GROUP_ID: ${{ vars.MANAGEMENT_GROUP_ID }}
      POLICY_DEFINITION_ID: ${{ needs.definition.outputs.policy-definition-id }}
      LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
      REMEDIATION_IDENTITY_RESOURCE_ID: ${{ vars.REMEDIATION_IDENTITY_RESOURCE_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build policy assignment
        run: az bicep build --file infra/policy-assignment.bicep --outfile "$RUNNER_TEMP/policy-assignment.json"
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy assignment with pre-provisioned remediation identity
        shell: bash
        run: |
          set -euo pipefail
          : "${MANAGEMENT_GROUP_ID:?Set MANAGEMENT_GROUP_ID}"
          : "${POLICY_DEFINITION_ID:?Policy definition deployment returned no ID}"
          : "${LOG_ANALYTICS_WORKSPACE_ID:?Set LOG_ANALYTICS_WORKSPACE_ID}"
          : "${REMEDIATION_IDENTITY_RESOURCE_ID:?Set REMEDIATION_IDENTITY_RESOURCE_ID (output of infra/remediation-identity.bicep)}"
          az deployment mg create \
            --name policy-assignment \
            --management-group-id "$MANAGEMENT_GROUP_ID" \
            --location "$AZURE_LOCATION" \
            --template-file "$RUNNER_TEMP/policy-assignment.json" \
            --parameters policyDefinitionId="$POLICY_DEFINITION_ID" \
              logAnalyticsWorkspaceId="$LOG_ANALYTICS_WORKSPACE_ID" \
              remediationIdentityResourceId="$REMEDIATION_IDENTITY_RESOURCE_ID" \
              location="$AZURE_LOCATION"
