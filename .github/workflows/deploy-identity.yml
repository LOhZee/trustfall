name: Deploy Pipeline Identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pipeline-identity
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      IDENTITY_RESOURCE_GROUP: ${{ vars.IDENTITY_RESOURCE_GROUP || 'rg-policy-pipeline' }}
      GITHUB_ORG: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate required environment variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set in the 'production-bootstrap' environment (Settings > Environments > production-bootstrap > Environment variables)."
              missing=1
            fi
          done
          exit $missing
      - name: Build identity template
        run: az bicep build --file infra/pipeline-identity.bicep --outfile "$RUNNER_TEMP/pipeline-identity.json"
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy identity and production federation
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub create \
            --name policy-pipeline-identity \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --template-file "$RUNNER_TEMP/pipeline-identity.json" \
            --parameters githubOrg="$GITHUB_ORG" githubRepo="$GITHUB_REPO" \
              githubEnvironment=production identityResourceGroupName="$IDENTITY_RESOURCE_GROUP" \
              location="$AZURE_LOCATION" \
            --query properties.outputs --output json
