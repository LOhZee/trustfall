name: Manual TrustFall assessment
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  trustfall:
    uses: trustfall-ci/trustfall/.github/workflows/scan.yml@REPLACE_WITH_FULL_COMMIT_SHA
    with:
      image: ghcr.io/trustfall-ci/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
      profile: baseline
      no_network: true
