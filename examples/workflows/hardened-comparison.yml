name: Default and hardened comparison inputs
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  baseline:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lohzee/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
    steps:
      - run: trustfall assess --profile baseline --no-network --output "$RUNNER_TEMP/baseline.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: baseline, path: "${{ runner.temp }}/baseline.json" }
  hardened:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lohzee/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - run: trustfall assess --profile baseline --no-network --output "$RUNNER_TEMP/hardened.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: hardened, path: "${{ runner.temp }}/hardened.json" }
  compare:
    needs: [baseline, hardened]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/lohzee/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: baseline, path: reports/baseline }
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with: { name: hardened, path: reports/hardened }
      - run: trustfall compare --output comparison.json reports/baseline/baseline.json reports/hardened/hardened.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: comparison, path: comparison.json }
