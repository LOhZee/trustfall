name: Self-hosted runner assessment
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  scanner:
    runs-on: [self-hosted, linux, trustfall-approved]
    timeout-minutes: 20
    container:
      image: ghcr.io/lohzee/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
      options: --init --cap-drop=ALL --security-opt=no-new-privileges
    steps:
      - run: trustfall assess --profile hardened --no-network --output "$RUNNER_TEMP/report.json" --summary "$GITHUB_STEP_SUMMARY"
