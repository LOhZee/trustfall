name: Pull request runtime assessment
on: { pull_request: {} }
# No id-token permission and no secrets. Fork code remains untrusted.
permissions: { contents: read }
jobs:
  trustfall:
    uses: LOhZee/trustfall/.github/workflows/scan.yml@REPLACE_WITH_FULL_COMMIT_SHA
    with:
      image: ghcr.io/lohzee/trustfall@sha256:REPLACE_WITH_RELEASE_DIGEST
      profile: hardened
      no_network: true
